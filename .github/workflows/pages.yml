name: Publier sur GitHub Pages (manuel)
on:
  # Publication toujours manuelle dans l'interface GitHub, ou par signal explicite de lot revu.
  # Les modifications ordinaires des fiches ne déclenchent AUCUN déploiement.
  push:
    branches:
      - main
    paths:
      - '.github/pages-publication-approved.txt'
  workflow_dispatch:
    inputs:
      contenu_revu:
        description: "J’ai relu les fiches et j’accepte de rendre ce site et les spoilers MJ consultables."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.contenu_revu == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer la version relue
        id: deployment
        uses: actions/deploy-pages@v4
