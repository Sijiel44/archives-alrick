name: DG-LOT-004 integrated local demo (no Pages)
on:
  push:
    branches: [prototype/dg004-integrated]
  pull_request:
    paths:
      - 'experiments/dg-lot004/**'
      - '.github/workflows/dg-lot004-integrated.yml'
permissions:
  contents: read
jobs:
  l004:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TESTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert real HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "testedHead=$TESTED_HEAD"
          echo "checkoutHead=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
      - run: npm ci
      - run: npm test
      - name: Verify byte-identical owner sources and executable tests at exact HEAD
        run: node experiments/dg-lot004/tools/verify-owner-blobs.mjs
      - name: Build DG004 with pinned DG003 owner modules
        run: node experiments/dg-lot004/tools/build.mjs
      - name: Test DG004 integration-only demo contract
        run: node --test experiments/dg-lot004/tests/integration/*.test.mjs
      - name: BUILDER owner local preview contract (real source)
        run: node --test experiments/dg-lot004/builder/tests/ports.test.mjs
      - name: MATH owner XP decisions against M01 (real TS)
        run: node --test experiments/dg-lot004/math-xp/tests/xp-decision.test.mjs experiments/dg-lot004/math-xp/tests/encounter-recommendations.test.mjs experiments/dg-lot004/math-xp/tests/repair-math-browser-parity.test.mjs
      - name: INDEX owner 64 ESM tests and unexecuted-native M01 controls
        run: node --test experiments/dg-lot004/tests/catalog/catalog.test.mjs experiments/dg-lot004/tests/catalog/catalog-r2.test.mjs experiments/dg-lot004/tests/catalog/native-m01.test.mjs
      - name: STUDIO owner isolated mode contract tests
        run: node --test experiments/dg-lot004/tests/studio/*.test.mjs experiments/dg-lot004/tests/studio/L004_PENDING_REAL_INTEROP.mjs
      - name: ATELIERS owner descriptive cycle state and DOM tests
        run: node --test experiments/dg-lot004/tests/creators/cycle-state.test.mjs experiments/dg-lot004/tests/creators/cycle-ui.test.mjs
      - name: Identify official Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser=''
          for candidate in google-chrome-stable google-chrome /opt/google/chrome/chrome /usr/bin/google-chrome-stable; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" || { echo 'NON EXÉCUTÉ : Chrome officiel absent' >&2; exit 2; }
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Real Chrome loopback demonstration and rollback
        run: node experiments/dg-lot004/tools/test-demo-browser.mjs
      - name: Record source SHA on failure too
        if: always()
        run: |
          echo "testedHead=$TESTED_HEAD"
          echo "checkoutHead=$(git rev-parse HEAD)"
