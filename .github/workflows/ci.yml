name: Vérifier les Archives
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Contenu, TypeScript, build et liens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Conserver le bilan d’intégrité B-002
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrite-b002
          path: artifacts/b002/
          if-no-files-found: ignore
      - run: npm run test:m04:browser
      - name: Recette Studio et régies multimédias sur le site assemblé
        timeout-minutes: 5
        env:
          STUDIO_PAGES_TEST: '1'
          STUDIO_SCREENSHOT_DIR: artifacts/studio
        run: node --test --test-concurrency=2 studio-local/tests/audio-data.test.mjs studio-local/tests/audio.test.mjs studio-local/tests/video-data.test.mjs studio-local/tests/video.test.mjs studio-local/tests/medias-data.test.mjs studio-local/tests/medias.test.mjs studio-local/tests/fiabilite-data.test.mjs studio-local/tests/fiabilite.test.mjs studio-local/tests/organisations.test.mjs studio-local/tests/antagonistes.test.mjs studio-local/tests/pages.test.mjs
      - name: Recette dédiée Bestiaire et copie indépendante
        timeout-minutes: 2
        run: node --test studio-local/tests/bestiaire-browser.test.mjs
      - name: ARCHIVES-EFF-003 — transaction INDEX réelle, deux onglets et restauration
        timeout-minutes: 3
        run: node --test studio-local/tests/index-effects-transaction.test.mjs
      - name: Conserver les captures du Studio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-studio-ci
          path: artifacts/studio/
          if-no-files-found: ignore
      - name: Conserver les captures de recette M04.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-m041-ci
          path: artifacts/m041/
          if-no-files-found: ignore
      - name: Services choisis et images de scène
        timeout-minutes: 5
        run: node --test --test-concurrency=2 studio-local/tests/service-media-data.test.mjs studio-local/tests/service-media.test.mjs studio-local/tests/services-integration.test.mjs studio-local/tests/scene-images.test.mjs
      # Aucun artefact Pages ni déploiement sur les branches et PR.
      - name: Quêtes, indices et liens de retour
        timeout-minutes: 3
        run: node --test --test-concurrency=2 studio-local/tests/quetes-data.test.mjs studio-local/tests/quetes.test.mjs
