name: Vérifier les Archives
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Contenu, TypeScript, build et liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Conserver le bilan d’intégrité B-002
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrite-b002
          path: artifacts/b002/integrite.json
          if-no-files-found: ignore
      - run: npm run test:m04:browser
      - name: Conserver les captures de recette M04.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-m041-ci
          path: artifacts/m041/
          if-no-files-found: ignore
      # Aucun artefact Pages ni déploiement sur les branches et PR.
